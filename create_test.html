{% extends "base.html" %}
{% block title %}Create Test{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h4 class="mb-1">Create a Test</h4>
            <p class="page-subtitle mb-4">Adding to: {{ class_.name }}</p>

            <form method="POST" id="testForm">
                <div class="mb-3">
                    <label class="form-label">Test Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Chapter 3 Quiz" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Description <span class="text-muted">(optional)</span></label>
                    <textarea name="description" class="form-control" rows="2" placeholder="What is this test about?"></textarea>
                </div>

                <hr>
                <h5 class="mb-3" style="color:#fff;">Questions</h5>

                <div id="questions-container">
                    <div class="card mb-4 question-card" id="question-1">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span style="color:#10C75A;font-weight:600;font-size:0.9rem;">Question 1</span>
                            </div>
                            <div class="mb-3">
                                <input type="text" name="question_1" class="form-control" placeholder="Enter your question here..." required>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text">A</span>
                                        <input type="text" name="q1_a" class="form-control" placeholder="Option A" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text">B</span>
                                        <input type="text" name="q1_b" class="form-control" placeholder="Option B" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text">C</span>
                                        <input type="text" name="q1_c" class="form-control" placeholder="Option C" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text">D</span>
                                        <input type="text" name="q1_d" class="form-control" placeholder="Option D" required>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="form-label">Correct Answer</label>
                                <select name="q1_correct" class="form-select" required>
                                    <option value="">Select correct answer...</option>
                                    <option value="a">A</option>
                                    <option value="b">B</option>
                                    <option value="c">C</option>
                                    <option value="d">D</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-primary w-100 mb-4" onclick="addQuestion()">+ Add Another Question</button>
                <button type="submit" class="btn btn-primary w-100">Create Test</button>
            </form>

            <p class="text-center mt-3 mb-0" style="font-size:0.875rem;">
                <a href="/class/{{ class_.id }}">Back to class</a>
            </p>
        </div>
    </div>
</div>

<script>
let questionCount = 1;
function addQuestion() {
    questionCount++;
    const container = document.getElementById('questions-container');
    const div = document.createElement('div');
    div.className = 'card mb-4 question-card';
    div.id = 'question-' + questionCount;
    div.innerHTML = `
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span style="color:#10C75A;font-weight:600;font-size:0.9rem;">Question ${questionCount}</span>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeQuestion(${questionCount})">Remove</button>
            </div>
            <div class="mb-3">
                <input type="text" name="question_${questionCount}" class="form-control" placeholder="Enter your question here..." required>
            </div>
            <div class="row g-2 mb-3">
                <div class="col-md-6"><div class="input-group"><span class="input-group-text">A</span><input type="text" name="q${questionCount}_a" class="form-control" placeholder="Option A" required></div></div>
                <div class="col-md-6"><div class="input-group"><span class="input-group-text">B</span><input type="text" name="q${questionCount}_b" class="form-control" placeholder="Option B" required></div></div>
                <div class="col-md-6"><div class="input-group"><span class="input-group-text">C</span><input type="text" name="q${questionCount}_c" class="form-control" placeholder="Option C" required></div></div>
                <div class="col-md-6"><div class="input-group"><span class="input-group-text">D</span><input type="text" name="q${questionCount}_d" class="form-control" placeholder="Option D" required></div></div>
            </div>
            <div>
                <label class="form-label">Correct Answer</label>
                <select name="q${questionCount}_correct" class="form-select" required>
                    <option value="">Select correct answer...</option>
                    <option value="a">A</option>
                    <option value="b">B</option>
                    <option value="c">C</option>
                    <option value="d">D</option>
                </select>
            </div>
        </div>`;
    container.appendChild(div);
}
function removeQuestion(num) {
    const el = document.getElementById('question-' + num);
    if (el) el.remove();
}
</script>
{% endblock %}
